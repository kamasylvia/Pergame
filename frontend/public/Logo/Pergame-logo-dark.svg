<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Pergame">
  <title>Pergame</title>
  <!--
    Pergame brand mark: an abstract P.

    Replaces upstream Alexandrie's abstract A. Same visual language — solid
    organic masses, every edge a curve, no stroked letterform — so the two
    marks read as a lineage rather than a change of species.

    The signature move: the bowl is pushed INTO the stem and both live in one
    evenodd path, so the overlap subtracts into a white channel running the
    full height of the bowl. That channel separates the two masses without
    opening a gap between them, and leaves the counter as its own closed
    lens. Everything else follows from the proportions:
      · stem top flush with the bowl's top — a protruding head reads as a
        "D with a stick";
      · the stem runs on well below the bowl — equal heights read as a thorn
        or a rho;
      · the counter stays closed and rounded — opened to the right the glyph
        turns into a thorn.

    Nothing is painted white anywhere: the channel and the counter are real
    holes, so one file works on light, dark and coloured surfaces.

    Verified at 400 / 32 / 16 px. The channel blurs at 16px but the
    silhouette and counter hold, which is the limit that matters for favicons.
  -->
  <path fill-rule="evenodd" fill="#4a7aff"
        d="M150 128
           A30 30 0 0 1 210 128
           L210 384
           A30 30 0 0 1 150 384
           Z
           M178 98
           C288 98 356 136 356 205
           C356 274 288 312 178 312
           Z
           M254 170
           C236 170 222 184 222 202
           C222 220 236 234 254 234
           L288 234
           C306 234 318 220 318 202
           C318 184 306 170 288 170
           Z"/>
</svg>
