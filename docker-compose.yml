services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: pergame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pergame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pergame}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s

  # Object Storage (RustFS, S3 compatible)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: pergame-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-pergame-key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-pergame-secret}
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-false}"
      RUSTFS_LOG_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
    ports:
      - "${RUSTFS_EXTERNAL_PORT:-9000}:9000"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Pergame Backend (Rust rewrite; image built and published by GHCR)
  #
  # Images come from ghcr.io/<owner>/<repo>-{backend,frontend,dr-backup}
  # (see .github/workflows/docker-image-release.yml). Pin PERGAME_TAG to a
  # release tag for reproducible deploys (`latest` follows releases).
  # Upgrade flow: `docker compose pull && docker compose up -d`.
  backend:
    image: ghcr.io/kamasylvia/pergame-backend:${PERGAME_TAG:-latest}
    container_name: pergame-backend
    environment:
      # General configuration
      BACKEND_PORT: 8201
      GIN_MODE: release

      # Security and authentication
      JWT_SECRET: ${JWT_SECRET:-your-secure-jwt-secret-key-change-this-in-production}
      # Bare host only — a port here produces an invalid Cookie Domain
      # attribute and browsers/clients silently drop the auth cookies.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost} # e.g. yourdomain.com (no scheme, no port)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8200} # URL where the frontend is hosted (for CORS policy and url generation in emails)
      ALLOW_UNSECURE: "${ALLOW_UNSECURE:-true}" # Set to 'true' if you run without HTTPS (e.g., local dev);

      # Flags
      CONFIG_DISABLE_SIGNUP: "${CONFIG_DISABLE_SIGNUP:-false}" # Disable user signup if set to 'true'
      CONFIG_DISABLE_NATIVE_LOGIN: "${CONFIG_DISABLE_NATIVE_LOGIN:-false}" # Disable native username/password login if set to 'true' (useful if you only want OAuth providers)

      # Database Configuration
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-pergame}
      DATABASE_USER: ${POSTGRES_USER:-pergame}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-password}

      # Object storage configuration (S3 compatible like RustFS, MinIO, etc.)
      # OPTIONAL: If you don't want to use the CDN feature you can leave these variables empty
      S3_ENDPOINT: rustfs:9000
      S3_PUBLIC_URL: ${CDN_URL:-http://localhost:${RUSTFS_EXTERNAL_PORT:-9000}}
      S3_SECURE: "${S3_SECURE:-false}" # Set to 'true' if your S3 endpoint uses HTTPS
      S3_INSECURE_TLS: "${S3_INSECURE_TLS:-false}" # Set to 'true' if your S3 endpoint uses self-signed certificates
      S3_ACCESSKEY: ${RUSTFS_ACCESS_KEY:-pergame-key}
      S3_SECRETKEY: ${RUSTFS_SECRET_KEY:-pergame-secret}
      S3_BUCKET: ${S3_BUCKET:-pergame}

      # Scheduled user-level snapshots (hours; 0/unset = disabled).
      SNAPSHOT_INTERVAL_HOURS: "${SNAPSHOT_INTERVAL_HOURS:-0}"
      # Optional end-to-end encryption passphrase for snapshot blobs.
      PERGAME_SNAPSHOT_PASSPHRASE: "${PERGAME_SNAPSHOT_PASSPHRASE:-}"

      # Trash retention (days; 0 = keep deleted nodes forever).
      TRASH_RETENTION_DAYS: "${TRASH_RETENTION_DAYS:-30}"
      # How often the retention sweeper runs (hours).
      TRASH_SWEEP_INTERVAL_HOURS: "${TRASH_SWEEP_INTERVAL_HOURS:-24}"

      # SMTP Configuration (only for password reset emails)
      # OPTIONAL: If you don't want to use email features, you can leave these variables empty
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_MAIL: ${SMTP_MAIL:-}
      SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      # DR sidecar shared volumes — must match the dr_conf/dr_jobs mounts
      # below; without these the backend's DR admin API always reports
      # "sidecar not deployed" even though the volumes are mounted.
      DR_CONF_DIR: /conf
      DR_JOBS_DIR: /jobs

    # No published port by default: browsers reach the API through the
    # frontend's same-origin proxy (NUXT_PUBLIC_API_PROXY_TARGET). Set
    # BACKEND_DIRECT_PORT in .env to publish it for debugging.
    ports:
      - "${BACKEND_DIRECT_PORT:-}:8201"
    volumes:
      - dr_conf:/conf
      - dr_jobs:/jobs
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Pergame Frontend
  frontend:
    image: ghcr.io/kamasylvia/pergame-frontend:${PERGAME_TAG:-latest}
    container_name: pergame-frontend
    restart: unless-stopped
    environment:
      PORT: 8200

      # Flags
      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: "${CONFIG_DISABLE_SIGNUP:-false}" # Disable signup page if set to 'true'
      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: "${CONFIG_DISABLE_LANDING:-false}" # Disable landing page

      # Runtime configuration. BASE_API/BASE_CDN stay empty: the browser uses
      # same-origin paths and the Nitro proxy middleware forwards /api and the
      # CDN endpoint prefix to the containers below (no CORS, one port).
      NUXT_PUBLIC_BASE_API: ""
      NUXT_PUBLIC_BASE_CDN: ""
      NUXT_PUBLIC_CDN_ENDPOINT: ${CDN_ENDPOINT:-/pergame/}
      NUXT_PUBLIC_API_PROXY_TARGET: "http://backend:8201"
      NUXT_PUBLIC_CDN_PROXY_TARGET: "http://rustfs:9000"
      NUXT_PUBLIC_BASE_URL: ${FRONTEND_URL:-http://localhost:8200}

    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8200}:8200"
    depends_on:
      - backend

  # Instance DR sidecar (spec backup-restore.md §10): executes dr-backup.sh
  # jobs handed over by the backend through the shared volumes. Optional -
  # remove this service (and the backend's /conf,/jobs mounts) to disable.
  dr-backup:
    # 版本跟随它要 dump 的 pg 大版本:pg18 镜像里的 pg_dump 只能导出
    # <= 18 的服务器(见 scripts/Dockerfile.sidecar)。pg 升大版本时
    # 同步改这里的 tag。workflow 会同时发布 <tag> 与 pg18-<tag>。
    image: ghcr.io/kamasylvia/pergame-dr-backup:pg18-latest
    container_name: pergame-dr-backup
    restart: unless-stopped
    environment:
      SCHEDULE_HOURS: "${DR_BACKUP_SCHEDULE_HOURS:-0}"
      SCAN_INTERVAL_SECONDS: 2
    volumes:
      - dr_conf:/conf
      - dr_jobs:/jobs

# The compose default network, explicitly named so the deployment is
# independent of the directory the compose file lives in.
networks:
  default:
    name: pergame

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
  dr_conf:
  dr_jobs:
