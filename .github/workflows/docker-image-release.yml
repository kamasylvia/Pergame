name: Build and Publish Docker Images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Pergame version tag, e.g. 0.0.1 (published as v0.0.1 plus latest)"
        required: true
      ref:
        description: "Git ref to build from (tag name, branch, or full 40-char SHA). Leave empty to build the repository default branch."
        required: false
        default: ""

# Both images build for linux/amd64 only.
#
# Decision (2026-11-11): the whole pipeline is amd64-only, not just the
# frontend. The arm64 legs compile under QEMU
# emulation, which is slow and — for `bun run build` in the frontend — hangs
# indefinitely (measured: amd64 ~1min vs arm64 wedged at "Bundling app" for
# 2.5h and 6h across two runs, both needing manual cancellation and blocking
# every later step). Emulated cross-builds also carry a silent risk of
# producing subtly wrong artifacts, so the rule is: no QEMU in this pipeline.
# To ship arm64 later, add a native arm64 runner job (runs-on: ubuntu-24.04-arm)
# and merge the manifests — never re-enable QEMU emulation here.
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Image tags are Pergame versions only (v0.0.1 + latest). The git ref
      # used for checkout is a separate concern: a release builds its own tag,
      # a dispatch builds whatever ref was given.
      - name: Resolve version and ref
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            REF="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            REF="${{ github.event.inputs.ref }}"
          fi
          # Normalise to a leading v so both "0.0.1" and "v0.0.1" work.
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          if [ -z "$VERSION" ] || [ "$VERSION" = "v" ]; then
            echo "::error::version is required (e.g. 0.0.1)"
            exit 1
          fi
          if [ -z "$REF" ]; then
            REF="${{ github.event.repository.default_branch }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Building version $VERSION from ref $REF"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Set lowercase repository name
        id: repo
        run: echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The fork ships the Rust rewrite (backend-rs/), not the upstream Go
      # tree (backend/) — that one is kept only for reference.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-rs
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-backend:${{ steps.tag.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-backend:latest

      # Frontend is amd64-only like the rest of the pipeline; see the
      # platform note at the top of this file for the measurement.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-frontend:${{ steps.tag.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-frontend:latest
