name: Build and Publish Docker Images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Git to build"
        required: true
      # Escape hatch: a corrupted GHA cache entry can make the buildx restore
      # hang (observed 2026-11-11: two runs wedged >2.5h on the frontend
      # step). Dispatch with this checked to build it cacheless.
      no_frontend_cache:
        description: "Skip buildx GHA cache for the frontend image"
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set lowercase repository name
        id: repo
        run: echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The fork ships the Rust rewrite (backend-rs/), not the upstream Go
      # tree (backend/) — that one is kept only for reference.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-rs
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-backend:latest
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-backend:${{ steps.tag.outputs.tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_frontend_cache == true }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-frontend:latest
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-frontend:${{ steps.tag.outputs.tag }}

      # Instance DR sidecar (pinned postgres:18.2 base so pg_dump matches the
      # server). No floating tags: pg_dump behavior must be reproducible per
      # release, so the compose files reference pg18-<release-tag> exactly.
      - name: Build and push DR sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./scripts
          file: ./scripts/Dockerfile.sidecar
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-dr-backup:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.repo_lc }}-dr-backup:pg18-${{ steps.tag.outputs.tag }}
