# ==============================================================================
# Pergame — 精简版(复用已有 PostgreSQL + S3)
#
# 只跑三个服务:backend / frontend / dr-backup。
# pg 与对象存储用外部已有的,通过名为 postgres 的外部 Docker 网络接入。
#
# 所有配置直接写在本文件里,**不需要 .env**。改配置 = 编辑本文件后
#   docker compose -f docker-compose.external.yml up -d
#
# 与 docker-compose.yml 的区别:那个是自包含版(pg + RustFS 一起起,5 个服务
# 5 个卷,配 .env 使用);这个只跑应用本身(3 个服务 2 个卷)。精简版的好处:
# down -v 只删 DR 配置,不会碰 pg 数据或 S3 对象。
#
# 前置:
#   1) 确认外部网络存在:docker network inspect postgres
#   2) 确认 pg 容器在其中,记下容器名 → 填 DATABASE_HOST
#   3) 手工建库(backend 只跑 migration,不建库):
#        docker exec -it <pg容器> psql -U postgres -c 'CREATE DATABASE pergame;'
#   4) 确认 S3 桶存在(backend 会自动建,但不会改已有桶的归属)
#
# 启动:
#   docker compose -f docker-compose.external.yml up -d
# ==============================================================================
services:
  # ---------------------------------------------------------------- backend
  backend:
    image: ghcr.io/kamasylvia/pergame-backend:latest
    container_name: pergame-backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8201
      GIN_MODE: release

      # ---------- 认证:必须改 ----------
      # 改 JWT_SECRET = 所有会话失效。生成:openssl rand -hex 32
      JWT_SECRET: "CHANGE-ME-openssl-rand-hex-32"
      # 只填主机名,不带协议不带端口。带端口会产生非法 Cookie Domain,
      # 浏览器静默丢弃认证 cookie(症状:登录成功但所有操作 401)
      COOKIE_DOMAIN: "pergame.example.com"
      # 浏览器访问前端的地址,用于 CORS 白名单与邮件链接
      FRONTEND_URL: "http://192.168.1.10:8200"
      # 无 HTTPS 时 true;上 HTTPS 后改 false
      ALLOW_UNSECURE: "true"
      CONFIG_DISABLE_SIGNUP: "false"
      CONFIG_DISABLE_NATIVE_LOGIN: "false"

      # ---------- 外部 PostgreSQL:必须改 ----------
      # DATABASE_HOST = pg 容器在 postgres 网络里的名字(不是 IP、不是域名)
      DATABASE_HOST: "pg18"
      DATABASE_PORT: 5432
      DATABASE_NAME: "pergame"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "CHANGE-ME-pg-password"

      # ---------- 外部对象存储:必须改 ----------
      # S3_ENDPOINT 是**容器内**能访问到的地址;若 S3 监听宿主机端口,
      # 容器内用 172.17.0.1(docker0 网关)或 host.docker.internal。
      # 填 localhost 会指向容器自身,必然失败。
      S3_ENDPOINT: "http://172.17.0.1:8010"
      # S3_PUBLIC_URL 是**浏览器**能访问到的地址(附件直链走它)
      S3_PUBLIC_URL: "http://192.168.1.10:8010"
      # S3 走 HTTPS 时填 true
      S3_SECURE: "false"
      S3_ACCESSKEY: "CHANGE-ME-s3-access-key"
      S3_SECRETKEY: "CHANGE-ME-s3-secret-key"
      # 建议用独立空桶:backend 启动会给整个桶设公共读策略
      S3_BUCKET: "pergame"

      # ---------- 快照与回收站 ----------
      # 每 N 小时自动为所有用户建快照;0 = 关闭
      SNAPSHOT_INTERVAL_HOURS: "0"
      # 快照端到端加密口令。设了务必存密码管理器,丢了加密快照永久不可解
      PERGAME_SNAPSHOT_PASSPHRASE: ""
      # 回收站保留天数;0 = 永不自动清理
      TRASH_RETENTION_DAYS: "30"
      TRASH_SWEEP_INTERVAL_HOURS: "24"

      # ---------- 邮件(可选,不填则密码重置不可用)----------
      SMTP_HOST: ""
      SMTP_MAIL: ""
      SMTP_MAIL_FROM: ""
      SMTP_PASSWORD: ""

    # No published port: the browser reaches the API through the frontend's
    # same-origin proxy (NUXT_PUBLIC_API_PROXY_TARGET below). For direct
    # access during debugging, temporarily re-add:
    #   ports: ["8201:8201"]
    expose:
      - "8201"
    volumes:
      - dr_conf:/conf
      - dr_jobs:/jobs
    networks:
      - pergame
      - postgres

  # --------------------------------------------------------------- frontend
  frontend:
    image: ghcr.io/kamasylvia/pergame-frontend:latest
    container_name: pergame-frontend
    restart: unless-stopped
    environment:
      PORT: 8200
      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: "false"
      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: "false"
      # ---- 同源反代模式(推荐):浏览器只访问前端端口 ----
      # BASE_API/BASE_CDN 留空 = 走相对路径,由 Nitro 中间件转发:
      #   /api/**        → NUXT_PUBLIC_API_PROXY_TARGET (backend 容器)
      #   /pergame/**    → NUXT_PUBLIC_CDN_PROXY_TARGET (对象存储)
      NUXT_PUBLIC_BASE_API: ""
      NUXT_PUBLIC_BASE_CDN: ""
      NUXT_PUBLIC_CDN_ENDPOINT: "/pergame/"
      # backend 服务在本 compose 的 pergame 网络内,直接用服务名
      NUXT_PUBLIC_API_PROXY_TARGET: "http://backend:8201"
      # S3 内网地址:容器内访问宿主机端口用 172.17.0.1(填 localhost 会指向容器自身)
      NUXT_PUBLIC_CDN_PROXY_TARGET: "http://172.17.0.1:8010"
      # 前端自身访问地址(浏览器地址栏)
      NUXT_PUBLIC_BASE_URL: "http://192.168.1.10:8200"
    ports:
      - "8200:8200"
    depends_on:
      - backend
    networks:
      - pergame

  # --------------------------------------------------------------- dr-backup
  # 实例 DR sidecar:执行 backend 通过共享卷交付的 pg_dump 任务。
  # 不需要实例级备份就删掉本服务 + backend 的 /conf,/jobs 挂载。
  dr-backup:
    image: ghcr.io/kamasylvia/pergame-dr-backup:latest
    container_name: pergame-dr-backup
    restart: unless-stopped
    environment:
      # 全局定时 pg_dump 间隔(小时);0 = 仅手动。
      # 推荐用 UI 里的目标级 cron(更灵活),此项留 0 即可。
      SCHEDULE_HOURS: "0"
      SCAN_INTERVAL_SECONDS: "2"
    volumes:
      - dr_conf:/conf
      - dr_jobs:/jobs
    networks:
      - pergame
      - postgres   # sidecar 要连 pg 做 dump

networks:
  # 应用内部网络(本 compose 自建)
  pergame:
    driver: bridge
  # 已有的外部网络,pg 容器在其中;compose 不创建也不删除它
  postgres:
    external: true

volumes:
  dr_conf:
  dr_jobs:
