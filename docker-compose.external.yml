# ==============================================================================
# Pergame — 精简版(复用已有 PostgreSQL + S3)
#
# 只跑三个服务:backend / frontend / dr-backup。
# pg 与对象存储用外部已有的,通过名为 postgres 的外部 Docker 网络接入。
#
# 所有配置直接写在本文件里,**不需要 .env**。改配置 = 编辑本文件后
#   docker compose -f docker-compose.external.yml up -d
#
# 与 docker-compose.yml 的区别:那个是自包含版(pg + RustFS 一起起,5 个服务
# 5 个卷,配 .env 使用);这个只跑应用本身(3 个服务 2 个卷)。精简版的好处:
# down -v 只删 DR 配置,不会碰 pg 数据或 S3 对象。
#
# 前置:
#   1) 确认外部网络存在:docker network inspect postgres
#   2) 确认 pg 容器在其中,记下容器名 → 填 DATABASE_HOST
#   3) 手工建库(backend 只跑 migration,不建库):
#        docker exec -it <pg容器> psql -U postgres -c 'CREATE DATABASE pergame;'
#   4) 确认 S3 桶存在(backend 会自动建,但不会改已有桶的归属)
#
# 启动:
#   docker compose -f docker-compose.external.yml up -d
# ==============================================================================
services:
  # ---------------------------------------------------------------- backend
  backend:
    image: ghcr.io/kamasylvia/pergame-backend:latest
    container_name: pergame-backend
    restart: unless-stopped
    environment:
      # 只列无默认值或与环境强相关的变量;其余全有安全默认
      # (快照/回收站/SMTP/注册开关等),全量参考:
      # docs/content/6.deploy/6.configurations-list.md
      # 改 JWT_SECRET = 所有会话失效。生成:openssl rand -hex 32
      JWT_SECRET: "CHANGE-ME-openssl-rand-hex-32"
      # 无 HTTPS 时必须显式 true:默认走 secure cookie,HTTP 下浏览器拒收
      ALLOW_UNSECURE: "true"

      # ---------- 外部 PostgreSQL ----------
      # pg 容器在 postgres 网络里的名字(不是 IP、不是域名)
      DATABASE_HOST: "pg18"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "CHANGE-ME-pg-password"

      # ---------- 外部对象存储 ----------
      # S3 是宿主机上的原生服务(非容器),经 host.docker.internal 访问
      # (由下方 extra_hosts 映射到宿主机网关,Linux 上必须显式声明)。
      S3_ENDPOINT: "http://host.docker.internal:8010"
      # 浏览器能访问到的地址(附件直链走它)
      S3_PUBLIC_URL: "http://qnap.elf-balance.ts.net:8010"
      S3_ACCESSKEY: "CHANGE-ME-s3-access-key"
      S3_SECRETKEY: "CHANGE-ME-s3-secret-key"

      # ---------- DR sidecar 共享卷 ----------
      # 与下方 dr_conf/dr_jobs 挂载对应;不部署 DR 就连这两行带卷一起删
      DR_CONF_DIR: "/conf"
      DR_JOBS_DIR: "/jobs"
      # 时区:影响 target cron 调度与日志墙钟(镜像含 tzdata)。
      # 不设 = UTC;要按本地墙钟跑 `0 2 * * *` 这类调度就解开注释
      # TZ: "Asia/Shanghai"

    # No published port: the browser reaches the API through the frontend's
    # same-origin proxy (NUXT_PUBLIC_API_PROXY_TARGET below). `expose` would
    # be pure documentation here (same-network containers can reach every
    # port regardless), so it is omitted. For direct access during debugging,
    # temporarily re-add: ports: ["8201:8201"]
    # S3 是宿主机原生服务:把 host.docker.internal 指到宿主机网关
    # (Linux 必需,不加此映射 host.docker.internal 无法解析)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dr_conf:/conf
      - dr_jobs:/jobs
    networks:
      - default   # 应用网络(top-level 里改名为 pergame)
      - postgres

  # --------------------------------------------------------------- frontend
  frontend:
    image: ghcr.io/kamasylvia/pergame-frontend:latest
    container_name: pergame-frontend
    restart: unless-stopped
    environment:
      PORT: 8200
      # ---- 同源反代模式(推荐):浏览器只访问前端端口 ----
      # BASE_API/BASE_CDN 留空(默认)走相对路径,由 Nitro 中间件转发:
      #   /api/**      → NUXT_PUBLIC_API_PROXY_TARGET(backend 容器)
      #   /pergame/**  → NUXT_PUBLIC_CDN_PROXY_TARGET(对象存储)
      # backend 服务在本 compose 的 pergame 网络内,直接用服务名
      NUXT_PUBLIC_API_PROXY_TARGET: "http://backend:8201"
      # S3 内网地址:宿主机原生服务,经 host.docker.internal 访问(见 backend extra_hosts)
      NUXT_PUBLIC_CDN_PROXY_TARGET: "http://host.docker.internal:8010"
    ports:
      - "8200:8200"
    # frontend 的 CDN 代理同样要访问宿主机上的原生 S3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  # --------------------------------------------------------------- dr-backup
  # 实例 DR sidecar:执行 backend 通过共享卷交付的 pg_dump 任务。
  # 不需要实例级备份就删掉本服务 + backend 的 /conf,/jobs 挂载。
  dr-backup:
    # 版本跟随它要 dump 的 pg 大版本:pg18 镜像里的 pg_dump 只能导出
    # <= 18 的服务器。pg 升大版本时必须同步改这里的 tag。
    image: ghcr.io/kamasylvia/pergame-dr-backup:pg18-latest
    container_name: pergame-dr-backup
    restart: unless-stopped
    # 镜像自带全部默认值(SCHEDULE_HOURS=0 仅手动 / SCAN_INTERVAL_SECONDS=2 /
    # JOBS_DIR=/jobs / CONF_DIR=/conf);要定时 dump 或改路径时才需要显式 env
    # (见 docs/content/6.deploy/6.configurations-list.md 的 DR sidecar 节)。
    environment:
      # 时区:备份 stamp 目录(如 2026-11-11_020000)与 job 时间戳跟它走。
      # 与 backend 的 TZ 保持一致,人工核对异地目录时不用换算时差
      TZ: "Asia/Shanghai"
    # rclone 目的地若指向宿主机上的 S3,同样需要 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dr_conf:/conf
      - dr_jobs:/jobs
    networks:
      - default
      - postgres   # sidecar 要连 pg 做 dump

networks:
  # 应用内部网络 = compose 的 default 网络,显式改名为 pergame。
  # 未在服务里声明 networks 的服务自动加入它;声明了的要显式带上 default。
  default:
    name: pergame
  # 已有的外部网络,pg 容器在其中;compose 不创建也不删除它
  postgres:
    external: true

# 卷名显式固定:compose 默认会加「目录名_」前缀,目录改名/移动后
# 会生成一套全新的空卷(旧数据还在但容器挂的是新卷)。显式命名避免这种漂移。
volumes:
  dr_conf:
    name: pergame-dr-conf
  dr_jobs:
    name: pergame-dr-jobs
