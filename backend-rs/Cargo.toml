[package]
name = "alexandrie-rs"
version = "0.1.0"
edition = "2024"
description = "Alexandrie backend (Rust rewrite)"

[dependencies]
ammonia = "4.2.4"
aws-config = "1.13.0"
aws-sdk-s3 = "1.157.0"
axum = { version = "0.8.9", features = ["multipart"] }
bcrypt = "0.19.3"
cookie = "0.18.2"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
toasty = { version = "0.11.0", features = ["postgresql"] }
toasty-driver-postgresql = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.2.1"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[profile.release]
lto = "thin"
strip = true
