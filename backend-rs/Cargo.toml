[package]
name = "alexandrie-rs"
version = "0.1.0"
edition = "2024"
description = "Alexandrie backend (Rust rewrite)"

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
toasty = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
