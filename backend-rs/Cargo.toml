[package]
name = "pergame-rs"
version = "0.0.11"
edition = "2024"
description = "Pergame backend (Rust rewrite)"

[dependencies]
ammonia = "4.2.4"
aws-config = "1.13.0"
aws-sdk-s3 = "1.157.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cookie = "0.18.2"
croner = "2.1.4"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
hex = "0.4.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", features = ["smtp-transport", "builder"] }
rand = { version = "0.10.3", features = ["thread_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls", "form", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "migrate", "macros", "uuid"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting"] }
toasty = { version = "0.11.0", features = ["postgresql"] }
toasty-driver-postgresql = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.2.1"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
aws-smithy-http-client = { version = "1.5", features = ["rustls-ring"] }
aws-smithy-runtime-api = { version = "1.9", default-features = false, features = ["client"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false, features = ["std", "simple"] }
rmcp = { version = "3.9.0", default-features = false, features = ["transport-streamable-http-server", "server", "macros", "schemars"] }
schemars = "1"

[profile.release]
lto = "thin"
strip = true
