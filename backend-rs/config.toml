# Alexandrie (Rust) default configuration. Override with CONFIG_PATH or env.

[Database]
Driver = "pgx"
Host = "localhost"
Name = "alexandrie"
Port = 5432
User = "alexandrie"
Password = ""

[Cdn]
MaxSize = 20000000            # 20MB per file
MaxUploadsSize = 1073741824   # 1GB total per user
SupportedTypesImages = ["image/png","image/jpeg","image/gif","image/bmp","image/webp","image/avif","image/svg+xml","image/vnd.microsoft.icon"]
SupportedTypes = ["image/png","image/jpeg","image/gif","image/bmp","image/webp","image/avif","image/svg+xml","image/vnd.microsoft.icon","video/mp4","video/x-msvideo","video/quicktime","video/x-ms-wmv","video/x-flv","video/x-matroska","video/webm","audio/mpeg","audio/wav","audio/ogg","audio/flac","audio/aac","audio/webm","application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document","application/vnd.ms-excel","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-powerpoint","application/vnd.openxmlformats-officedocument.presentationml.presentation","text/plain","text/csv","application/zip","application/x-rar-compressed","application/x-tar","application/gzip","application/x-bzip2"]

[Auth]
AccessTokenExpiry = 1800      # 30 minutes
RefreshTokenExpiry = 604800   # 7 days
